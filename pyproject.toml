[project]
name = "nexus"
version = "1.0.0"
description = "FinCore Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "ollama",
    "yfinance>=1.3.0",
    "apscheduler>=3.11.2",
    "aiohttp>=3.13.5",
    "tradingview-mcp-server",
    "langgraph>=1.1.8",
    "borsa-mcp",
    "mcp-server",
    "maverick-mcp",
    "kospi-kosdaq-stock-server",
    "aiofiles>=25.1.0",
    "jinja2>=3.1.6",
    "youtube-transcript-api>=1.2.4",
    "chromadb>=1.5.8",
    "protobuf<=3.20.3",
    "yt-dlp>=2026.3.17",
    "openai-whisper>=20250625",
    "duckduckgo-search>=8.1.1",
    "google-genai>=1.0.0",
    "finance-datareader",
    "pandas",
    "numpy",
    "pyyaml",
    "pykrx",
    "scipy",
    "matplotlib",
    "beautifulsoup4",
    "lxml",
    "tqdm",
    "gspread",
    "markdownify",
    "fastmcp",
]

[tool.uv.workspace]
members = [
    "skills/tradingview_mcp/src",
    "skills/borsa_mcp/src",
    "skills/financial_datasets_mcp/src",
    "skills/maverick_mcp/src",
    "skills/kospi_kosdaq_stock_server/src",
]

[tool.uv.sources]
tradingview-mcp-server = { workspace = true }
borsa-mcp = { workspace = true }
mcp-server = { workspace = true }
maverick-mcp = { workspace = true }
kospi-kosdaq-stock-server = { workspace = true }
